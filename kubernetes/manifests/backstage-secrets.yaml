apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: backstage
type: Opaque
stringData:
  # Token do ServiceAccount "backstage" — gerado com:
  # kubectl create token backstage -n default --duration=8760h
  K8S_SERVICE_ACCOUNT_TOKEN: "SUBSTITUA_PELO_TOKEN"
  # CA do cluster em base64 — gerado com:
  # kubectl config view --raw --minify --flatten -o jsonpath='{.clusters[].cluster.certificate-authority-data}'
  K8S_CA_DATA: "SUBSTITUA_PELO_CA_DATA"
  # GitHub fine-grained token com permissoes: Contents (read) + Metadata (read) + Members (read)
  GITHUB_TOKEN: "SUBSTITUA_PELO_GITHUB_TOKEN"
