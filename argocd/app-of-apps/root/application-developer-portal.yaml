apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: developer-portal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: developer-portal
    app.kubernetes.io/part-of: backstage
spec:
  project: backstage
  source:
    repoURL: https://github.com/westibcar/internal-developer-portal.git
    targetRevision: main
    path: argocd/app-of-apps/apps
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
