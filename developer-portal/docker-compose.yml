services:
  backstage:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "3000:3001"
      - "7007:7007"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/app
      - ../scaffolder-template-backstage:/workspace/scaffolder-template-backstage
      - /Users/uday/.workspace/internal-developer-portal/scaffolder-template-backstage:/Users/uday/.workspace/internal-developer-portal/scaffolder-template-backstage
      - /tmp:/tmp
      - backstage_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -lc "
      if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then yarn install; fi &&
      socat TCP-LISTEN:3001,fork,reuseaddr TCP6:[::1]:3000 &
      yarn workspace backend start &
      exec yarn workspace app start --host 0.0.0.0 --port 3000
      "

volumes:
  backstage_node_modules:
